name: Deploy to S3

on:
  push:
    branches:
      - main

env:
  # The name of the existing S3 bucket to deploy to.
  BUCKET_NAME: montandon-website
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm docs:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync \
            ./docs/.vitepress/dist s3://${{ env.BUCKET_NAME }} \
            --delete \
            --quiet
