name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *" # daily, refreshes the data coverage page
  workflow_dispatch:

  # The Data Sources page is generated at build time from the source manifest
  # published by IFRCGo/monty-stac-extension, so a deploy is a snapshot of that
  # manifest. Rebuild weekly to pick up upstream changes without a push here.
  schedule:
    - cron: "0 0 * * 0"

  # Preferred trigger once a token with `contents: write` on this repository
  # exists upstream: monty-stac-extension fires this after its docs deploy and
  # the site refreshes in minutes rather than within a week. Inert until then.
  repository_dispatch:
    types: [sources-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write lets the job commit the refreshed coverage files below.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - uses: actions/configure-pages@v4

      - name: Install
        run: pnpm install

      - name: Fetch data coverage
        run: node scripts/fetch-coverage.mjs

      - name: Build
        run: pnpm docs:build

      # Keeps the repo (and the script's stale-data fallback) current. A push
      # made with GITHUB_TOKEN doesn't re-trigger this workflow. Failure here
      # shouldn't block the deploy.
      - name: Commit coverage if changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/methodology/data-coverage.md scripts/data-coverage-state.json
          git diff --staged --quiet || git commit -m "Update data coverage"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
